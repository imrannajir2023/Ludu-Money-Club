
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ludo Money Club</title>
    <script>
      // CRITICAL: Define process before ANY other script or module loads
      window.process = { env: { API_KEY: "" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;900&display=swap');
      
      :root {
        --ludo-blue: #020617;
        --gold-primary: #fbbf24;
        --gold-secondary: #d97706;
      }

      body {
        font-family: 'Fredoka', sans-serif;
        background-color: var(--ludo-blue);
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        user-select: none;
        color: white;
        -webkit-tap-highlight-color: transparent;
      }

      .ludo-money-logo {
        font-weight: 900;
        text-transform: uppercase;
        font-style: italic;
        background: linear-gradient(to bottom, #fff 10%, #fbbf24 40%, #ea580c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #7c2d12) drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      /* Animation for Scrolling Notice */
      @keyframes scroll-text {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-scroll-text {
        animation: scroll-text 20s linear infinite;
        display: flex;
        width: fit-content;
      }

      .dotted-bg {
        background-color: #050a18;
        background-image: radial-gradient(rgba(251, 191, 36, 0.05) 1.5px, transparent 1.5px);
        background-size: 25px 25px;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      
      .dice-scene { width: 60px; height: 60px; perspective: 600px; margin: 0 auto; }
      .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
      .cube-face { position: absolute; width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000); border: 2px solid rgba(0,0,0,0.2); border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 8px; box-sizing: border-box; box-shadow: inset 0 0 15px rgba(0,0,0,0.4); }
      .dot { width: 10px; height: 10px; background-color: white; border-radius: 50%; justify-self: center; align-self: center; }
      .face-1 { transform: rotateY(0deg) translateZ(30px); }
      .face-2 { transform: rotateY(90deg) translateZ(30px); }
      .face-3 { transform: rotateY(180deg) translateZ(30px); }
      .face-4 { transform: rotateY(-90deg) translateZ(30px); }
      .face-5 { transform: rotateX(90deg) translateZ(30px); }
      .face-6 { transform: rotateX(-90deg) translateZ(30px); }
      .show-1 { transform: rotateX(0deg) rotateY(0deg); }
      .show-2 { transform: rotateX(0deg) rotateY(-90deg); }
      .show-3 { transform: rotateX(0deg) rotateY(-180deg); }
      .show-4 { transform: rotateX(0deg) rotateY(90deg); }
      .show-5 { transform: rotateX(-90deg) rotateY(0deg); }
      .show-6 { transform: rotateX(90deg) rotateY(0deg); }
      .rolling { animation: rolling 0.5s linear infinite; }
      @keyframes rolling { 0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg); } }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

    "@google/genai": "https://esm.sh/@google/genai",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
