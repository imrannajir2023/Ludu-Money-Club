
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Money Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
      
      :root {
        --ludo-blue: #0f172a;
        --gold-primary: #fbbf24;
        --gold-secondary: #d97706;
      }

      body {
        font-family: 'Fredoka', sans-serif;
        background-color: var(--ludo-blue);
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        color: white;
      }

      .ludo-money-logo {
        font-weight: 900;
        text-transform: uppercase;
        font-style: italic;
        background: linear-gradient(to bottom, #fff 20%, #fbbf24 50%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #92400e) drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        letter-spacing: -0.05em;
        line-height: 0.9;
      }

      .premium-card {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(251, 191, 36, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .gold-button {
        background: linear-gradient(to bottom, #fbbf24, #d97706);
        box-shadow: 0 4px 0 #92400e, 0 10px 20px rgba(217, 119, 6, 0.3);
        transition: all 0.1s;
      }
      .gold-button:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #92400e;
      }

      .dotted-bg {
        background-color: var(--ludo-blue);
        background-image: radial-gradient(rgba(251, 191, 36, 0.03) 2px, transparent 2px);
        background-size: 30px 30px;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 20s linear infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      .animate-float {
        animation: float 4s infinite ease-in-out;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
