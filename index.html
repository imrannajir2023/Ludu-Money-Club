
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Money Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
      
      :root {
        --ludo-blue: #0f172a;
        --gold-primary: #fbbf24;
        --gold-secondary: #d97706;
      }

      body {
        font-family: 'Fredoka', sans-serif;
        background-color: var(--ludo-blue);
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        color: white;
      }

      .ludo-money-logo {
        font-weight: 900;
        text-transform: uppercase;
        font-style: italic;
        background: linear-gradient(to bottom, #fff 20%, #fbbf24 50%, #d97706 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #92400e) drop-shadow(0 8px 15px rgba(0,0,0,0.5));
        letter-spacing: -0.05em;
        line-height: 0.9;
      }

      .premium-card {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(251, 191, 36, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .gold-button {
        background: linear-gradient(to bottom, #fbbf24, #d97706);
        box-shadow: 0 4px 0 #92400e, 0 10px 20px rgba(217, 119, 6, 0.3);
        transition: all 0.1s;
      }
      .gold-button:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #92400e;
      }

      .dotted-bg {
        background-color: var(--ludo-blue);
        background-image: radial-gradient(rgba(251, 191, 36, 0.03) 2px, transparent 2px);
        background-size: 30px 30px;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-marquee {
        animation: marquee 20s linear infinite;
      }

      /* 3D DICE SYSTEM - ENHANCED */
      .dice-scene {
        width: 80px;
        height: 80px;
        perspective: 800px;
        margin: 20px;
      }

      .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(0.17, 0.67, 0.83, 1.2); /* Bouncy settle */
      }

      .cube.rolling {
        animation: fast-rolling 0.15s infinite linear;
      }

      @keyframes fast-rolling {
        0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.1); }
        50% { transform: rotateX(180deg) rotateY(180deg) rotateZ(90deg) scale(1.3); }
        100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg) scale(1.1); }
      }

      .cube-face {
        position: absolute;
        width: 80px;
        height: 80px;
        background: #fff;
        border: 2px solid #ddd;
        border-radius: 14px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 10px;
        gap: 4px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.1);
        backface-visibility: hidden;
      }

      .dot { background: #1a1a1a; border-radius: 50%; width: 100%; height: 100%; box-shadow: inset 0 2px 2px rgba(255,255,255,0.2); }

      /* Face Positions */
      .face-1 { transform: rotateY(0deg) translateZ(40px); background: #fdfdfd; }
      .face-2 { transform: rotateY(90deg) translateZ(40px); background: #fafafa; }
      .face-3 { transform: rotateX(90deg) translateZ(40px); background: #f8f8f8; }
      .face-4 { transform: rotateX(-90deg) translateZ(40px); background: #f5f5f5; }
      .face-5 { transform: rotateY(-90deg) translateZ(40px); background: #f2f2f2; }
      .face-6 { transform: rotateY(180deg) translateZ(40px); background: #efefef; }

      /* Rotation to show specific face */
      .show-1 { transform: rotateX(0deg) rotateY(0deg); }
      .show-2 { transform: rotateX(0deg) rotateY(-90deg); }
      .show-3 { transform: rotateX(-90deg) rotateY(0deg); }
      .show-4 { transform: rotateX(90deg) rotateY(0deg); }
      .show-5 { transform: rotateX(0deg) rotateY(90deg); }
      .show-6 { transform: rotateX(0deg) rotateY(180deg); }

      .dice-jump {
        animation: pro-jump 0.6s ease-out;
      }
      @keyframes pro-jump {
        0% { transform: translateY(0); }
        40% { transform: translateY(-60px); }
        70% { transform: translateY(5px); }
        100% { transform: translateY(0); }
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.91.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
