
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ludo Money Club</title>
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;900&display=swap');
      
      :root {
        --ludo-bg: #0f172a;
        --club-blue: #2b64f3;
        --gold: #fbbf24;
      }

      body {
        font-family: 'Fredoka', sans-serif;
        background-color: var(--ludo-bg);
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        color: white;
        -webkit-tap-highlight-color: transparent;
      }

      .ludo-money-logo {
        font-weight: 900;
        text-transform: uppercase;
        font-style: italic;
        background: linear-gradient(to bottom, #fff 10%, #fbbf24 40%, #ea580c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 0 #7c2d12);
        letter-spacing: -0.02em;
      }

      .dotted-bg {
        background-color: #050a18;
        background-image: radial-gradient(rgba(251, 191, 36, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* DICE ANIMATIONS - GPU Accelerated */
      .dice-scene { 
        width: 70px; height: 70px; perspective: 1000px; 
        transform: translateZ(0); 
        backface-visibility: hidden;
      }
      .cube { 
        width: 100%; height: 100%; position: relative; transform-style: preserve-3d; 
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        will-change: transform;
      }
      .cube-face { 
        position: absolute; width: 70px; height: 70px; 
        background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000); 
        border: 2px solid rgba(255,255,255,0.2); border-radius: 14px;
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        padding: 10px; box-sizing: border-box; box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        backface-visibility: hidden;
      }
      .dot { width: 12px; height: 12px; background: white; border-radius: 50%; justify-self: center; align-self: center; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
      
      .face-1 { transform: rotateY(0deg) translateZ(35px); }
      .face-2 { transform: rotateY(90deg) translateZ(35px); }
      .face-3 { transform: rotateY(180deg) translateZ(35px); }
      .face-4 { transform: rotateY(-90deg) translateZ(35px); }
      .face-5 { transform: rotateX(90deg) translateZ(35px); }
      .face-6 { transform: rotateX(-90deg) translateZ(35px); }

      .show-1 { transform: rotateX(0deg) rotateY(0deg); }
      .show-2 { transform: rotateX(0deg) rotateY(-90deg); }
      .show-3 { transform: rotateX(0deg) rotateY(-180deg); }
      .show-4 { transform: rotateX(0deg) rotateY(90deg); }
      .show-5 { transform: rotateX(-90deg) rotateY(0deg); }
      .show-6 { transform: rotateX(90deg) rotateY(0deg); }

      .rolling { animation: rolling 0.15s linear infinite; }
      @keyframes rolling { 
        from { transform: rotateX(0) rotateY(0); } 
        to { transform: rotateX(360deg) rotateY(360deg); } 
      }
      
      .dice-glow { animation: dice-glow 1.2s ease-in-out infinite; }
      @keyframes dice-glow {
        0%, 100% { filter: drop-shadow(0 0 5px #fbbf24); transform: scale(1); }
        50% { filter: drop-shadow(0 0 20px #fbbf24); transform: scale(1.08); }
      }
    </style>

{

  }
}
</script>
